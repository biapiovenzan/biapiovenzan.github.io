sobre:
  titulo: Quem escuta
  destaque: Sou psicóloga clínica guiada pela curiosidade sobre a experiência
    humana e pelo desejo de criar **espaços de escuta genuína**.
  foto:
    imagem: foto-b.jpg
    descricao: Beatriz Piovenzan sorrindo, sentada em uma poltrona azul com uma
      xícara nas mãos
    enquadramento: 60% 40%
  blocos:
    - titulo: A terapia como encontro
      texto: Acredito que a psicoterapia é um encontro que possibilita ampliar a
        consciência sobre si mesmo, compreender padrões de funcionamento e
        construir novas formas de estar no mundo.
    - titulo: A abordagem
      texto: Atuo a partir da Gestalt-terapia, que valoriza o contato com a
        experiência presente, a responsabilidade sobre as próprias escolhas e a
        construção de relações mais autênticas consigo mesmo e com os outros.
    - titulo: Além da clínica
      texto: Também sou professora de inglês e francês. Essa experiência fortaleceu
        minha sensibilidade para processos de aprendizagem, comunicação e
        desenvolvimento humano, e ampliou meu olhar sobre as diferentes formas
        pelas quais as pessoas constroem sentido, lidam com desafios e
        desenvolvem suas potencialidades.
    - titulo: O que orienta o trabalho
      texto: O compromisso com o cuidado, o respeito à singularidade de cada pessoa e
        o interesse constante em aprender e me desenvolver como profissional.
  focos_introducao: Nem sempre existe um nome para o que se sente. Estes são
    alguns dos temas que costumam trazer as pessoas até a terapia.
  focos:
    - tema: Migração
      descricao: Morar fora, voltar, recomeçar. Identidade e pertencimento em construção.
    - tema: Ansiedade
      descricao: Quando a cabeça corre na frente e o corpo sente antes de entender.
    - tema: Depressão
      descricao: Quando o sentido some e fica difícil sustentar o dia a dia.
    - tema: Autoestima
      descricao: A forma como você se enxerga, se cobra e se trata.
    - tema: Autoconhecimento
      descricao: Perceber o que você sente, escolhe e repete.
    - tema: Relações interpessoais
      descricao: Vínculos, limites e padrões que se repetem com o outro.
    - tema: Transições de vida
      descricao: Mudanças de fase, de rumo ou de lugar, e o que elas mexem em você.
abordagem:
  titulo: Gestalt-terapia
  introducao: O foco é a **sua** experiência, a forma como você se relaciona
    consigo, com os outros e com o mundo.
  voce: O que você sente, percebe e escolhe, no aqui-agora.
  outro: As relações, os limites e os padrões que aparecem no contato.
  mundo: O contexto em que a vida acontece e as formas criativas de se ajustar a ele.
  destaque: Mais do que explicar o *porquê*, a Gestalt busca ampliar a consciência
    sobre o *como* e o *para quê* das experiências, especialmente no aqui-agora.
  texto_1: Isso permite perceber padrões em tempo real e experimentar novas formas
    de se posicionar, levando à responsabilidade pessoal e a escolhas mais
    autênticas.
  texto_2: Busco sempre a compreensão genuína do seu ponto de vista, sem
    interpretações precipitadas ou pré-julgamentos.
  saude_titulo: O que é saúde
  saude_texto: Em Gestalt-terapia, saúde não é ausência de problemas e doenças. É
    a capacidade de se autorregular, de fazer escolhas com autonomia e
    responsabilidade e se adaptar de forma criativa às situações da vida,
    mantendo equilíbrio e autenticidade.
